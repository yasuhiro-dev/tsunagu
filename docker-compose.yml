services:
  mysql_container:
    image: mysql:8.0.32
    platform: linux/amd64
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: interview_app_development
      TZ: Asia/Tokyo
    volumes:
      - my_sql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  rails_container:
    build:
      context: interview_app
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: mysql_container
      DATABASE_NAME: interview_app_development
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: password
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      TZ: Asia/Tokyo
    depends_on:
      mysql_container:
        condition: service_healthy
    volumes:
      - ./interview_app:/rails
      - /rails/vendor/bundle

  next_container:
    build:
      context: meeting_front
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://rails_container:3000
    depends_on:
      - rails_container

    volumes:
      - ./meeting_front:/app
      - /app/node_modules

volumes:
  my_sql:
